<!doctype html><html data-theme="dautel"><head><meta charset="utf-8">
<link rel="stylesheet" href="{{ASSETS}}/fonts/fonts.css"><link rel="stylesheet" href="{{ASSETS}}/dautel.css"><link rel="stylesheet" href="_base.css">
<style>
.frame { width: 1280px; height: 420px; }
.brand { position: absolute; left: 64px; top: 58px; display: flex; align-items: center; gap: 18px; }
.brand img { width: 64px; height: 64px; }
.brand b { display: block; font-family: var(--font-mono); font-size: 44px; font-weight: 720; letter-spacing: 0.02em; color: var(--text); line-height: 1; }
.brand small { display: block; margin-top: 8px; font-family: var(--font-mono); font-size: 14px; color: var(--lavender); letter-spacing: 0.02em; }
.h { position: absolute; left: 64px; top: 176px; font-family: var(--font-sans); font-weight: 650; font-size: 56px; letter-spacing: -0.05em; line-height: 1.04; color: var(--text); }
.h span { font-family: var(--font-mono); color: var(--blue); font-size: 0.84em; letter-spacing: -0.03em; font-weight: 600; }
.s { position: absolute; left: 66px; top: 340px; font-family: var(--font-mono); font-size: 16px; color: var(--muted); }
.s b { color: var(--blue); font-weight: 600; }
.stack { position: absolute; right: 64px; top: 70px; display: flex; flex-direction: column; gap: 16px; }
.stack .node { position: relative; width: 330px; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 18px; font-size: 16px; }
.stack .node i { margin-left: auto; width: 8px; height: 8px; background: var(--mint); border-radius: 2px; }
</style></head><body><div class="frame">
<div class="brand"><img src="{{ASSETS}}/dautel-intelligent-operations-mark.svg" alt=""><div><b>OpsBrain</b><small>by Dautel Intelligent Operations</small></div></div>
<div class="h">One system of record<br><span>for people and agents.</span></div>
<div class="s"><b>&gt;_</b> Private &nbsp;·&nbsp; Self-hosted &nbsp;·&nbsp; Every action attributed &nbsp;·&nbsp; Approvals enforced</div>
<div class="stack">
  <div class="node lavender"><span class="k">01</span>Records and memory<i></i></div>
  <div class="node blue"><span class="k">02</span>CRM and pipeline<i></i></div>
  <div class="node mint"><span class="k">03</span>Approvals<i></i></div>
  <div class="node blue"><span class="k">04</span>PARA mirror, 4× a day<i></i></div>
</div>
</div></body></html>
