name: OpsBrain CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opsbrain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Type check
        run: deno task check
      - name: Tests (unit + end-to-end against Postgres)
        env:
          OPSBRAIN_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: deno task test
      - name: Validate compose file
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config --quiet
      - name: Deployment receiver tests
        run: python3 -m unittest discover -s deploy/cicd -p 'test_*.py'

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Build the dashboard (types and pages)
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: http://opsbrain:8787/open-brain-rest
          SESSION_SECRET: ci-build-placeholder-never-used-at-runtime
        run: npm run build

  images:
    needs: [test, dashboard]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      core: ${{ steps.core.outputs.digest }}
      dashboard: ${{ steps.dashboard.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish core and exporter
        id: core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/gen-skeptic/opsbrain:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=opsbrain-core
          cache-to: type=gha,mode=max,scope=opsbrain-core
      - name: Build and publish dashboard
        id: dashboard
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: true
          build-args: |
            OPSBRAIN_API_URL=http://opsbrain:8787/open-brain-rest
            OPSBRAIN_UI_THEME=dautel
          tags: ghcr.io/gen-skeptic/opsbrain-dashboard:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=opsbrain-dashboard
          cache-to: type=gha,mode=max,scope=opsbrain-dashboard

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://opsbrain-dash.dautel.cloud
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy tested image digests and verify health
        env:
          DEPLOY_APP: opsbrain
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          GH_TOKEN: ${{ github.token }}
          CORE_DIGEST: ${{ needs.images.outputs.core }}
          DASHBOARD_DIGEST: ${{ needs.images.outputs.dashboard }}
        run: python3 deploy/cicd/client.py
